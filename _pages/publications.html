---
layout: archive
title: "Publications"
permalink: /publications/
---

{% assign sorted_pubs = site.publications | sort: "weight" %}
{% for pub in sorted_pubs %}
<div class="list__item">
  <h3 class="archive__item-title">{{ pub.title }}</h3>
  <p class="archive__item-excerpt">{{ pub.authors }}<br><em>{{ pub.venue }}</em></p>
</div>
{% endfor %}
